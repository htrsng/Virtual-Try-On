name: API Fuzzing Checks
on:
  push:
    branches: [main, portfolio-cleanup]
    paths:
      - 'fuzzing-security-testing/**'
      - '.github/workflows/fuzzing.yml'
  pull_request:
    paths:
      - 'fuzzing-security-testing/**'
      - '.github/workflows/fuzzing.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fuzzing:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: fuzzing-security-testing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: npm ci --prefix target
        env:
          MONGOMS_DISABLE_POSTINSTALL: '1'
      - name: Kiem tra hoi quy
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Doi chieu dac ta, khong thuc thi API
        run: python fuzzers/run_ch4.py --audit-only --output artifacts/spec-audit
      - name: Chay thu blackbox, whitebox va Z3
        run: python fuzzers/run_fuzzing.py --iterations 6 --iterations-per-case 2 --max-cases 1 --boundary-budget 2 --seed 7 --output artifacts/ci-smoke --concolic
      - name: Luu bang chung
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fuzzing-evidence
          path: fuzzing-security-testing/artifacts/ci-smoke/
          if-no-files-found: warn
