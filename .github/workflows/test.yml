name: VFitAI Testing CI

on:
  push:
    branches: [ "main" ]
    paths:
      - "client/**"
      - "server/**"
      - "tests/**"
      - "qa/**"
      - "scripts/**"
      - "archive/coursework-api-fuzzing/automation-testing/tests/**"
      - ".github/workflows/test.yml"
  pull_request:
    branches: [ "main" ]
    paths:
      - "client/**"
      - "server/**"
      - "tests/**"
      - "qa/**"
      - "scripts/**"
      - "archive/coursework-api-fuzzing/automation-testing/tests/**"
      - ".github/workflows/test.yml"

jobs:
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Dependencies
        run: cd server && npm ci
      - name: Run Backend Tests
        working-directory: server
        run: |
          mkdir -p ../.runtime/ci
          node node_modules/jest/bin/jest.js --runInBand --json --outputFile=../.runtime/ci/backend.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-results
          path: .runtime/ci/backend.json
          retention-days: 14

  frontend-tests:
    name: Frontend Tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Dependencies
        run: cd client && npm ci
      - name: Run Frontend Tests
        working-directory: client
        run: node node_modules/vitest/vitest.mjs run --config vitest.ci.config.ts
      - name: Run application helper unit tests
        run: |
          mkdir -p .runtime/ci
          node --experimental-strip-types --test --test-reporter=junit --test-reporter-destination=.runtime/ci/helper-units.xml archive/coursework-api-fuzzing/automation-testing/tests/fetch-timeout.test.mjs archive/coursework-api-fuzzing/automation-testing/tests/size-recommendation.test.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-test-results
          path: |
            .runtime/ci/frontend.json
            .runtime/ci/frontend.xml
            .runtime/ci/helper-units.xml
          retention-days: 14

  e2e-tests:
    name: Playwright E2E Tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Server Dependencies
        run: cd server && npm ci
      - name: Install Client Dependencies
        run: cd client && npm ci
      - name: Install Playwright Dependencies
        run: cd tests && npm ci
      - name: Install Playwright Browsers
        run: cd tests && npx playwright install --with-deps chromium
      - name: Run E2E Tests
        run: cd tests && npm test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: tests/playwright-report/
          retention-days: 14
