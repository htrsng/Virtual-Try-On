name: Reusable isolated QA job
on:
  workflow_call:
    inputs:
      suite:
        type: string
        required: true
      runner:
        type: string
        default: ubuntu-24.04
permissions:
  contents: read
jobs:
  execute:
    name: QA / ${{ inputs.suite }}
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 25
    env:
      MONGOMS_VERSION: '8.2.6'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.4'
          cache: npm
          cache-dependency-path: |
            client/package-lock.json
            server/package-lock.json
            tests/package-lock.json
      - name: Initialize SHA and environment report
        run: node scripts/ci/run.cjs init ${{ inputs.suite }}
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        if: startsWith(inputs.suite, 'selenium-')
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: qa/selenium-java/pom.xml
      - name: Install locked dependencies
        run: node scripts/ci/run.cjs install ${{ inputs.suite }}
      - name: Provision pinned browser
        run: node scripts/ci/run.cjs browsers ${{ inputs.suite }}
      - name: Execute required suite
        run: node scripts/ci/run.cjs run ${{ inputs.suite }}
      - name: Classify and publish report metadata
        if: always()
        env:
          CI_JOB_STATUS: ${{ job.status }}
        run: node scripts/ci/run.cjs finalize ${{ inputs.suite }}
      - name: Upload scoped reports and browser evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: qa-${{ inputs.suite }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .runtime/ci/${{ inputs.suite }}/
          if-no-files-found: warn
          retention-days: 14
